name: Build APK & Publish Release

on:
  push:
    branches:
      - main
      - master
      - claude/android-mobile-code-editor-ow5d0x
  workflow_dispatch:

# Required so the workflow can create a GitHub Release and upload the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass android \
            -keypass android \
            -alias codeeditor \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Code Editor, OU=Mobile, O=CodeEditor, L=, S=, C=US"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: codeeditor
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            "artifacts/CodeEditor-v1.0.${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeEditor-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Code Editor v1.0.${{ github.run_number }}
          body: |
            ### 📱 Code Editor — Android (VS Code style)

            Mobile-friendly code editor with syntax highlighting, a file
            explorer, tabs and a symbol toolbar.

            **Installation:** download the `.apk` below and install it on your
            Android phone (you may need to allow installs from unknown sources).
          files: artifacts/*.apk
          generate_release_notes: true
